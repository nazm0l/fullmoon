<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBeachNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030612" />
      <stop offset="50%" stop-color="#0a1538" />
      <stop offset="100%" stop-color="#04091a" />
    </linearGradient>
    <radialGradient id="moonGlowBeach" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fff8db" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#f5c84c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f5c84c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldPlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#f5c84c" />
      <stop offset="100%" stop-color="#d49618" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgBeachNight)" />

  <!-- Stars -->
  <circle cx="140" cy="100" r="1.5" fill="#fff" opacity="0.8" />
  <circle cx="280" cy="70" r="1" fill="#fff" opacity="0.6" />
  <circle cx="560" cy="90" r="1.8" fill="#fff" opacity="0.75" />
  <circle cx="690" cy="130" r="1.2" fill="#fff" opacity="0.65" />

  <!-- Large Moon -->
  <circle cx="400" cy="180" r="160" fill="url(#moonGlowBeach)" />
  <circle cx="400" cy="180" r="85" fill="#fff8e1" />
  <ellipse cx="370" cy="150" rx="18" ry="14" fill="#eed27b" opacity="0.25" />
  <ellipse cx="425" cy="195" rx="25" ry="18" fill="#eed27b" opacity="0.2" />

  <!-- Ocean Waves with Moon Reflection -->
  <rect y="310" width="800" height="290" fill="#081432" />
  <polygon points="400,310 320,600 480,600" fill="#f5c84c" opacity="0.3" />
  <ellipse cx="400" cy="335" rx="110" ry="5" fill="#fff" opacity="0.7" />
  <ellipse cx="400" cy="370" rx="170" ry="7" fill="#fdf3cf" opacity="0.5" />
  <ellipse cx="400" cy="415" rx="230" ry="9" fill="#f5c84c" opacity="0.35" />
  <ellipse cx="400" cy="465" rx="290" ry="11" fill="#f5c84c" opacity="0.2" />

  <!-- Beach Shoreline & Candle Lanterns -->
  <path d="M0,480 Q400,430 800,470 L800,600 L0,600 Z" fill="#040714" />
  <!-- Lantern 1 -->
  <circle cx="260" cy="500" r="30" fill="#f5c84c" opacity="0.25" />
  <circle cx="260" cy="500" r="6" fill="#fff9db" />
  <!-- Lantern 2 -->
  <circle cx="540" cy="495" r="30" fill="#f5c84c" opacity="0.25" />
  <circle cx="540" cy="495" r="6" fill="#fff9db" />

  <!-- Badge Banner -->
  <rect x="180" y="515" width="440" height="52" rx="26" fill="#0c1328" stroke="url(#goldPlate)" stroke-width="1.5" />
  <text x="400" y="548" fill="#fff8e1" font-family="'Hind Siliguri', system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    🌕 চাঁদের আলো ও সমুদ্রের কলতান
  </text>
</svg>
