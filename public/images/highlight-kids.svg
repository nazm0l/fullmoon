<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKidsNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050b1f" />
      <stop offset="50%" stop-color="#10204d" />
      <stop offset="100%" stop-color="#070e24" />
    </linearGradient>
    <radialGradient id="sparkleAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c84c" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#294082" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldPlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#f5c84c" />
      <stop offset="100%" stop-color="#d49618" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgKidsNight)" />

  <!-- Center Magical Glow -->
  <circle cx="400" cy="300" r="300" fill="url(#sparkleAura)" />

  <!-- Beach Sandcastle Base & Towers -->
  <rect x="290" y="340" width="60" height="100" rx="4" fill="#081026" stroke="#f5c84c" stroke-width="2" stroke-opacity="0.4" />
  <rect x="450" y="340" width="60" height="100" rx="4" fill="#081026" stroke="#f5c84c" stroke-width="2" stroke-opacity="0.4" />
  <rect x="350" y="310" width="100" height="130" rx="4" fill="#060c1d" stroke="#f5c84c" stroke-width="2" stroke-opacity="0.5" />

  <!-- Castle Cones & Flags -->
  <polygon points="320,290 285,340 355,340" fill="#f5c84c" opacity="0.8" />
  <polygon points="480,290 445,340 515,340" fill="#f5c84c" opacity="0.8" />
  <polygon points="400,240 345,310 455,310" fill="#fce288" />

  <!-- Castle Flag Pole & Flag -->
  <line x1="400" y1="240" x2="400" y2="200" stroke="#f5c84c" stroke-width="3" />
  <polygon points="400,200 435,215 400,230" fill="#f5c84c" />

  <!-- Sparkles of Magic -->
  <circle cx="250" cy="240" r="4" fill="#fff9db" />
  <circle cx="230" cy="270" r="2.5" fill="#f5c84c" />
  <circle cx="550" cy="230" r="4.5" fill="#fce288" />
  <circle cx="570" cy="265" r="3" fill="#fff" />
  <circle cx="340" cy="180" r="3" fill="#f5c84c" />
  <circle cx="460" cy="170" r="3.5" fill="#fff9db" />

  <!-- Badge Banner -->
  <rect x="180" y="505" width="440" height="52" rx="26" fill="#0c1328" stroke="url(#goldPlate)" stroke-width="1.5" />
  <text x="400" y="538" fill="#fff8e1" font-family="'Hind Siliguri', system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    🎈 বাচ্চাদের আনন্দ ও নিরাপদ খেলাধুলা
  </text>
</svg>
