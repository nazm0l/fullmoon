<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFamNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040817" />
      <stop offset="50%" stop-color="#0e1a42" />
      <stop offset="100%" stop-color="#050a1c" />
    </linearGradient>
    <radialGradient id="tableGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f5c84c" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#e69d1e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldPlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="50%" stop-color="#f5c84c" />
      <stop offset="100%" stop-color="#d49618" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgFamNight)" />

  <!-- Warm Table Center Glow -->
  <circle cx="400" cy="310" r="300" fill="url(#tableGlow)" />

  <!-- Beach Table Setting -->
  <ellipse cx="400" cy="420" rx="220" ry="48" fill="#091228" stroke="#f5c84c" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Golden Center Lantern -->
  <circle cx="400" cy="385" r="45" fill="#f5c84c" opacity="0.3" />
  <circle cx="400" cy="385" r="10" fill="#fffbe6" />
  <rect x="395" y="380" width="10" height="15" rx="2" fill="#d97706" opacity="0.8" />

  <!-- Family Silhouettes Sharing Food -->
  <!-- Father -->
  <circle cx="280" cy="300" r="26" fill="#050a1c" />
  <path d="M245,390 C245,335 315,335 315,390 Z" fill="#050a1c" />

  <!-- Mother -->
  <circle cx="520" cy="300" r="26" fill="#050a1c" />
  <path d="M485,390 C485,335 555,335 555,390 Z" fill="#050a1c" />

  <!-- Child / Youth -->
  <circle cx="400" cy="315" r="20" fill="#050a1c" />
  <path d="M370,390 C370,345 430,345 430,390 Z" fill="#050a1c" />

  <!-- Ambient String Lights Overhead -->
  <path d="M80,180 Q400,240 720,180" stroke="#f5c84c" stroke-width="2" stroke-dasharray="1 18" stroke-linecap="round" opacity="0.85" fill="none" />
  <circle cx="200" cy="198" r="4" fill="#fff9db" />
  <circle cx="300" cy="212" r="4" fill="#fff9db" />
  <circle cx="400" cy="216" r="5" fill="#fff9db" />
  <circle cx="500" cy="212" r="4" fill="#fff9db" />
  <circle cx="600" cy="198" r="4" fill="#fff9db" />

  <!-- Badge Banner -->
  <rect x="180" y="505" width="440" height="52" rx="26" fill="#0c1328" stroke="url(#goldPlate)" stroke-width="1.5" />
  <text x="400" y="538" fill="#fff8e1" font-family="'Hind Siliguri', system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    👨‍👩‍👧‍👦 ১০০% নিরাপদ পারিবারিক আড্ডা
  </text>
</svg>
